# Deploy the static site in website/ to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# Site URL: https://ayaan-there.github.io/redact-tool/
name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["website/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
